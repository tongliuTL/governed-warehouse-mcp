name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term-missing

  evals:
    name: Offline evals (no API key)
    runs-on: ubuntu-latest
    env:
      # Proves the gate needs no credentials: any real API call would fail.
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run gwm generate
      - name: Retrieval, grader validation, scripted agent cases (+ replayed cassettes when present)
        run: uv run gwm-eval all --gate
      - name: Judge calibration from the committed verdicts (no model calls)
        run: uv run gwm-eval calibrate --model MiniMax-M3.1-Flash --min-kappa 0.6
      - run: cat reports/report.md reports/calibration-*.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: reports/

  dense:
    name: Dense retrieval (report only)
    runs-on: ubuntu-latest
    # Measures the optional dense ranker; never blocks a merge. The default (lexical) path is
    # gated in the evals job.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --extra dense
      - uses: actions/cache@v4
        with:
          path: ~/.cache/governed-warehouse-mcp/dense/models
          key: dense-model-BAAI-bge-small-en-v1.5
      - run: uv run gwm generate
      - run: uv run gwm-eval --out reports-dense all --dense
      - run: uv run pytest -q tests/test_dense.py
      - run: sed -n '/### Retrieval/,$p' reports-dense/report.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
