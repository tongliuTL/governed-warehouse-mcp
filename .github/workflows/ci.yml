name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term-missing

  evals:
    name: Offline evals (no API key)
    runs-on: ubuntu-latest
    env:
      # Proves the gate needs no credentials: any real API call would fail.
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run gwm generate
      - name: Retrieval, grader validation, scripted agent cases (+ replayed cassettes when present)
        run: uv run gwm-eval all --gate
      - name: Judge calibration from the committed verdicts (no model calls)
        run: uv run gwm-eval calibrate --model MiniMax-M3.1-Flash --min-kappa 0.6
      - run: cat reports/report.md reports/calibration-*.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: reports/

  docker:
    name: Docker image (build and smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: Build
        run: docker build --build-arg UV_VERSION="$(uv --version | cut -d' ' -f2)" -t gwm:ci .
      - name: Run with a read-only root filesystem and only the public key mounted
        run: |
          uv run gwm keys --dir .keys
          docker run -d --name gwm --read-only --tmpfs /tmp -p 8000:8000 \
            -v "$PWD/.keys/public.pem:/keys/public.pem:ro" gwm:ci
          for _ in $(seq 1 30); do curl -fsS localhost:8000/readyz && exit 0; sleep 1; done
          exit 1
      - name: Smoke test (probes, bearer auth, governed queries)
        run: uv run python scripts/smoke_http.py http://localhost:8000 --keys .keys
      - name: Runs as a non-root user
        run: test "$(docker exec gwm id -u)" = 10001
      - name: Container logs
        if: always()
        run: docker logs gwm || true
