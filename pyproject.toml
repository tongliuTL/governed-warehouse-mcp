[project]
name = "governed-warehouse-mcp"
version = "0.1.0"
description = "A governed MCP server for analytical warehouse data, with an offline-reproducible eval harness for tool-calling agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Tong Liu" }]
keywords = ["mcp", "model-context-protocol", "llm", "agents", "evals", "text-to-sql", "semantic-layer", "governance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mcp>=2.3,<3",
  "anthropic>=1.13,<2",
  "duckdb>=1.2,<2",
  "sqlglot>=30,<31",
  "pydantic>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "pyyaml>=6,<7",
  "jsonschema>=4.20,<5",
]

[project.scripts]
gwm = "warehouse_mcp.cli:main"
gwm-eval = "warehouse_evals.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warehouse_mcp", "src/warehouse_evals"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT", "C4", "PL"]
ignore = [
  "E501",     # the formatter owns line length; long SQL and word lists stay readable
  "PLR0913",  # tool signatures mirror their JSON schema
  "PLR0917",  # same: MCP tool parameters are keyword arguments in the schema
  "PLR2004",  # magic numbers are fine in tests and fixtures
  "S101",     # assert is the test idiom
  "S311",     # random is used for synthetic data, not crypto
  "PLC0415",  # local imports keep CLI startup fast
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR0915", "PLR0912", "PT018"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["warehouse_mcp", "warehouse_evals"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["duckdb.*", "sqlglot.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "live: calls the real Claude API (needs ANTHROPIC_API_KEY); skipped by default",
]

[tool.coverage.run]
source = ["warehouse_mcp", "warehouse_evals"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]
